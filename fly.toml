# Fly.io configuration for Smart Content Scheduler
# Deploy with: fly deploy

app = "smart-content-scheduler"
primary_region = "ord"  # Chicago — change to closest region (iad=DC, lax=LA, sjc=SF, ewr=NJ)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  SHOPIFY_API_VERSION = "2025-01"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    port = 3000
    timeout = "10s"
    type = "http"
