[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

# NOTE: GDPR webhooks (customers/data_request, customers/redact, shop/redact)
# are NOT registered here. They are:
# 1. Only required for published/public apps (not dev apps)
# 2. Automatically registered by Shopify when you publish the app
# 3. Cannot be tested in development mode
# The handler endpoints are implemented in web/backend/routes/webhooks.js
# and will be available when the app is published.

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content,read_themes,write_content,write_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://41d9-2600-1700-2081-a290-1d1f-58c7-55be-931b.ngrok-free.app/auth/callback",
  "https://41d9-2600-1700-2081-a290-1d1f-58c7-55be-931b.ngrok-free.app/auth/shopify/callback"
]

[app_proxy]
url = "https://41d9-2600-1700-2081-a290-1d1f-58c7-55be-931b.ngrok-free.app/proxy"
subpath = "scheduler"
prefix = "apps"
